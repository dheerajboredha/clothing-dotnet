name: mydonet-project
on: 
  push:
    branches:
      - develop
jobs:
  dotnet_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.100'
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >
             -Dsonar.organization=dheerajboredha
             -Dsonar.projectKey=dheerajboredha_clothing-dotnet
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Publish .NET project
        run: dotnet publish -c Release SixteenClothing.csproj -o dheeraj

        # src/Presentation/Nop.Web/Nop.Web.csproj
